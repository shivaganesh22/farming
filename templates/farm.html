{%extends 'header.html'%}
{%block main%}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  </head>
  <style>
		h1 {
			color: mediumseagreen;
			text-align: center;
		}

		.warning {
			color: red;
			font-weight: bold;
			text-align: center;
		}
		.card{
		margin-left:410px;
		margin-top: 20px;
		color: white;
		}
		.container{
		background:#edf2f7;
		font-weight: bold;
		padding-bottom:10px;
		border-radius: 15px;
		}
	</style>




  <body style="background:#BCBBB8">
  

  <div class="container my-3 mt-3">
      <h1 class="text-success">Crop Recommendation System <span class="text-success">🌱</span></h1>


      <form action="" method="POST">
        {%csrf_token%}
          <div class="row">
              <div class="col-md-4">
					<label for="Nitrogen">Number of acres</label>
					<input type="number" id="Nitrogen" max="140" name="acres" placeholder="Enter no of acres" class="form-control" required step="0">
				</div>
               <div class="col-md-4">
					<label for="Phosporus">Irrigated facility</label>
                    <select name="facility" id="" required>
                        <option value="yes">Yes</option>
                        <option value="yes">No</option>
                    </select>
				</div>
				<div class="col-md-4">
					<label for="Potassium">Investement</label>
					<input type="number" id="Potassium" name="investment" placeholder="Enter Investment" class="form-control" required step="0">
				</div>
          </div>

           <div class="row mt-4">

           <div class="col-md-12 text-center">
				<button type="submit" class="btn btn-primary btn-lg">Submit</button>
			</div>
			</div>
      </form>

  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
{%endblock%}
